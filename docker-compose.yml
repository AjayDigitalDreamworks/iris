# IRIS — local-first stack. No cloud services are required; the core retail
# pipeline runs entirely on this machine.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: iris-backend:latest
    container_name: iris-backend
    restart: unless-stopped
    environment:
      IRIS_ENV: production
      IRIS_DATABASE_URL: sqlite:////app/data/iris.db
      # Override in .env — never commit real secrets.
      IRIS_SECRET_KEY: ${IRIS_SECRET_KEY:-CHANGE_ME_IN_THE_ENV_FILE}
      IRIS_JWT_SECRET: ${IRIS_JWT_SECRET:-CHANGE_ME_IN_THE_ENV_FILE}
      IRIS_ALLOWED_ORIGINS: ${IRIS_ALLOWED_ORIGINS:-http://localhost:8080}
      IRIS_AUTH_ENABLED: ${IRIS_AUTH_ENABLED:-true}
    volumes:
      - iris-data:/app/data
      - iris-logs:/app/logs
      # Models are mounted, not baked, so weights can be swapped without a rebuild.
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: iris-frontend:latest
    container_name: iris-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  iris-data:
  iris-logs:
